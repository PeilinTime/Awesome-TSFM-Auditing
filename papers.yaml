# =============================================================================
# Awesome-TSFM-Auditing: single source of truth.
#
# README.md is GENERATED from this file:  python scripts/build_readme.py
# To add a paper:                          python scripts/add_paper.py <arXiv-id> --category <key>
#                                          (fetches title/authors/date from arXiv, appends a stub here)
#
# Entry fields
#   id        short slug (unique)
#   title     exact title
#   authors   "First A, Second B, Third C, et al."
#   year      year of first arXiv submission (or publication year if no arXiv)
#   venue     "ICLR 2025" / "arXiv 2025" / ...
#   arxiv     arXiv id without version ("" if none)
#   url       non-arXiv landing page (used only when arxiv is empty)
#   code      official code URL ("" if none)
#   category  one of the category keys below
#   domain    ts | llm | ml   (time series / language models / general ML)
#   level     sample | dataset | both   (granularity of the audit decision)
#   access    black-box | grey-box | white-box
#             black-box = predictions only; grey-box = likelihoods/embeddings; white-box = gradients/fine-tuning
#   signal    what the method measures (short)
#   transfer  how it maps onto TSFM auditing (short; the point of this list)
#   note      one-line summary (used when `transfer` does not apply, e.g. models, surveys)
#   corpus / corpus_url   (models only) documented pretraining corpus
# =============================================================================

repo: PeilinTime/Awesome-TSFM-Auditing

# Coloured tags shown next to every method entry (and explained in the README legend).
# Colours are hex without '#'. Add a value here before using it in an entry.
tags:
  level:
    label: Level
    values:
      sample:  {color: "4C78A8", meaning: "decision for one window or sample"}
      dataset: {color: "F58518", meaning: "decision for a whole dataset (contamination extent)"}
      both:    {color: "72B7B2", meaning: "works at both granularities"}
  access:
    label: Access
    values:
      black-box: {color: "2B2B2B", meaning: "needs predictions only"}
      grey-box:  {color: "8A8A8A", meaning: "needs likelihoods or embeddings"}
      white-box: {color: "D9D9D9", meaning: "needs gradients or fine-tuning"}
  domain:
    label: Domain
    values:
      ts:  {color: "54A24B", meaning: "time-series model or data"}
      llm: {color: "B279A2", meaning: "language model"}
      ml:  {color: "E45756", meaning: "general machine learning"}

categories:   # emoji: shown in front of the section heading and in the table of contents
  - key: tsfm-auditing
    emoji: "🕵️"
    title: "Auditing Methods for Time Series Foundation Models"
    layout: method
    description: >-
      Methods whose target is a TSFM.

  - key: tsfm-leakage-eval
    emoji: "💧"
    title: "Information Leakage and Leakage-Aware Evaluation of TSFMs"
    layout: benchmark
    description: >-
      Analyses of *direct* leakage (the same series reused across pretraining and test sets, often after
      rescaling, renaming, or resampling) and *indirect* leakage (temporal overlap between correlated
      series), plus benchmarks and protocols designed to avoid them. These works also define how
      reliable non-members can be built: observations generated after a model's release.

  - key: ts-mia
    emoji: "🔐"
    title: "Membership Inference and Privacy for Time-Series Models"
    layout: method
    description: >-
      Membership inference on (mostly non-foundation) time-series models. Useful for sample-level attack
      features, sequence-level aggregation, and evaluation protocols specific to temporal data.

  - key: llm-finetune
    emoji: "🎛️"
    title: "Fine-Tuning and Adaptation-Dynamics-Based Detection"
    layout: method
    description: >-
      Methods that perturb the model (fine-tune it on unseen data, or on the audited set itself) and
      measure how members and non-members respond differently. They do not require token probabilities,
      only a loss, an embedding, or a gradient, all of which every TSFM provides.

  - key: llm-loss-reference
    emoji: "📉"
    title: "Loss-, Reference- and Gradient-Based Membership Inference (model-agnostic)"
    layout: method
    description: >-
      Classic membership inference that needs only a per-sample loss (here: forecast error), optionally
      calibrated by shadow/reference models or by perturbed neighbours. Directly applicable to point
      forecasters.

  - key: llm-score
    emoji: "🎲"
    title: "Token-Probability Scoring Functions"
    layout: method
    description: >-
      Membership scores computed from token-level probabilities or conditional likelihoods (e.g., Min-K%, 
      ReCaLL, and Infilling Score). These methods may be adapted to tokenized TSFMs that provide the required 
      probability outputs (e.g., Chronos-T5).

  - key: llm-dataset-level
    emoji: "🧮"
    title: "Dataset-Level Inference and Statistical Contamination Tests"
    layout: method
    description: >-
      Contamination in TSFMs is naturally a dataset-level question ("was this benchmark in the corpus?").
      These works aggregate weak sample-level signals into a statistically controlled decision, or test
      performance against reference models; both are wrappers that can sit on top of any TS score function.

  - key: pitfalls
    emoji: "⚠️"
    title: "Pitfalls, Critiques and Evaluations of Auditing Methods"
    layout: plain
    description: >-
      Read these before trusting any AUC. Temporal distribution shift between members and non-members
      (exactly the shift induced by post-release non-members) can make a blind baseline beat every
      attack; the same caveat applies to TSFM auditing.

  - key: surveys
    emoji: "📚"
    title: "Surveys"
    layout: plain
    description: ""

  - key: provenance
    emoji: "🔏"
    title: "Proactive Provenance: Data Watermarks and Copyright Traps"
    layout: method
    description: >-
      Instead of detecting membership after the fact, plant a detectable signal in the data before
      release. Time-series watermarking exists for generated data; watermarking public forecasting
      datasets to later prove pretraining use is an open direction.

  - key: tsfm-models
    emoji: "🤖"
    title: "Target Models and Their Documented Pretraining Corpora"
    layout: model
    description: >-
      Auditing needs ground truth. This table records, for the mainstream TSFMs, where the pretraining
      corpus is documented (the source for *member* datasets) and the arXiv v1 month, after which
      newly generated observations can serve as *non-members*.

  - key: ts-benchmarks
    emoji: "📏"
    title: "Benchmarks and Evaluation Suites"
    layout: benchmark
    description: >-
      Widely used evaluation suites, with a note on how (or whether) each handles pretraining overlap.

papers:

  # ---------------------------------------------------------------------------
  # Auditing methods for TSFMs
  # ---------------------------------------------------------------------------
  - id: tsfmaudit
    title: "TSFMAudit: Data Contamination Auditing in Forecasting Time Series Foundation Models"
    authors: "Hongkai Li, Shifeng Xie, Lefei Shen, et al."
    year: 2026
    venue: "arXiv 2026"
    arxiv: "2605.26161"
    code: "https://github.com/kkevin117/TSFMAudit"
    category: tsfm-auditing
    domain: ts
    level: dataset
    access: white-box
    signal: "Probe-time adaptation dynamics (loss drop, parameter displacement, adaptation efficiency), debiased against reference models"
    transfer: "First dataset-level contamination audit for forecasting TSFMs; 6 TSFMs, 187 datasets; compares against 10 baselines adapted from the LLM literature (raw loss, LiRA ratio, TS Min-K FFT)"

  # ---------------------------------------------------------------------------
  # Leakage analyses and leakage-aware evaluation
  # ---------------------------------------------------------------------------
  - id: rethinking-tsfm-eval
    title: "Rethinking Evaluation in the Era of Time Series Foundation Models: (Un)known Information Leakage Challenges"
    authors: "Marcel Meyer, Sascha Kaltenpoth, Kevin Zalipski, et al."
    year: 2025
    venue: "arXiv 2025"
    arxiv: "2510.13654"
    code: ""
    category: tsfm-leakage-eval
    domain: ts
    note: "Dataset-lineage analysis over 22 TSFMs and 401 datasets; formalises direct (sample overlap) and indirect (temporal overlap of correlated series) leakage; motivates global post-training cut-offs and post-release non-members"

  - id: ts-arena
    title: "TS-Arena – A Live Forecast Pre-Registration Platform"
    authors: "Marcel Meyer, Sascha Kaltenpoth, Henrik Albers, et al."
    year: 2025
    venue: "KDD 2026"
    arxiv: "2512.20761"
    code: "https://github.com/DAG-UPB/ts-arena"
    category: tsfm-leakage-eval
    domain: ts
    note: "Forecasts are pre-registered before the ground truth exists, removing both direct and indirect leakage by construction"

  - id: its-time
    title: "It's TIME: Towards the Next Generation of Time Series Forecasting Benchmarks"
    authors: "Zhongzheng Qiao, Sheng Pan, Anni Wang, et al."
    year: 2026
    venue: "ICML 2026"
    arxiv: "2602.12147"
    code: "https://github.com/zqiao11/TIME"
    category: tsfm-leakage-eval
    domain: ts
    note: "Benchmark assembled from data collected after the release of current TSFMs; used by TSFMAudit as a contamination-free negative control"

  - id: fidel-ts
    title: "Fidel-TS: A High-Fidelity Benchmark for Multimodal Time Series Forecasting"
    authors: "Zhijian Xu, Wanxu Cai, Xilin Dai, et al."
    year: 2025
    venue: "arXiv 2025"
    arxiv: "2509.24789"
    code: ""
    category: tsfm-leakage-eval
    domain: ts
    note: "Documents pretraining contamination and temporal/description leakage in existing multimodal TS benchmarks; rebuilds a leak-free benchmark from real-time APIs"

  - id: quitobench
    title: "QuitoBench: A High-Quality Open Time Series Forecasting Benchmark"
    authors: "Siqiao Xue, Zhaoyang Zhu, Wei Zhang, et al."
    year: 2026
    venue: "arXiv 2026"
    arxiv: "2603.26017"
    code: "https://github.com/hq-bench/quito"
    category: tsfm-leakage-eval
    domain: ts
    note: "Single proprietary source with no overlap with public pretraining corpora and a global temporal cut-off"

  - id: later-test-set
    title: "A Later Test Set Is Not a New Domain: Pretraining Familiarity Survives a Contamination-Free Hold-Out"
    authors: "Mahdi Naser Moghadasi, Faezeh Ghaderi"
    year: 2026
    venue: "arXiv 2026"
    arxiv: "2609.10357"
    code: ""
    category: tsfm-leakage-eval
    domain: ts
    note: "Evaluates Chronos, TimesFM and Moirai variants on a test window dated after every model's release; zero-shot gains concentrate on domains that resemble the pretraining corpora (corpus familiarity), even when temporal contamination is ruled out"

  - id: how-foundational
    title: "How Foundational are Foundation Models for Time Series Forecasting?"
    authors: "Nouha Karaouli, Denis Coquenet, Elisa Fromont, et al."

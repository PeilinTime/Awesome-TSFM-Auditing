    code: ""
    category: tsfm-leakage-eval
    domain: ts
    note: "Evaluates TSFMs on proprietary series guaranteed to be unseen; zero-shot advantage depends on alignment with the pretraining domain"

  # ---------------------------------------------------------------------------
  # Membership inference on time-series models
  # ---------------------------------------------------------------------------
  - id: mia-time-series-models

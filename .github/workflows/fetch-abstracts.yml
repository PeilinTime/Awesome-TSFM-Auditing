name: Fetch abstracts

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch abstracts that are already stored (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch missing abstracts from arXiv
        env:
          REFRESH: ${{ github.event.inputs.refresh }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            python scripts/fetch_abstracts.py --refresh
          else
            python scripts/fetch_abstracts.py
          fi

      - name: Regenerate README and commit
        run: |
          python scripts/build_readme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/abstracts.json README.md
          git diff --cached --quiet || git commit -m "docs: update abstracts and regenerate README"
          git pull --rebase origin main
          git push
